# Sidebar menu, rendered by _includes/sidebar.html and _includes/nav-items.html.
#
# Structure: one root entry for the project as a whole (Introduction), then ONE root
# entry per model. Inside a root entry, an item is either a page (title + url) or a
# group (title + children); groups nest. Groups directly under a root entry render as
# collapsible sub-menus; deeper groups render as plain labels.
#
# Order: model entries are sorted by release year, NEWEST FIRST. `released` is the
# year the entry's first model came out; the template ignores it, and
# tools/check_nav.py checks the order. Sources for the years:
#   2003  KN2400 / KN2600   unveiled at Summer NAMM 2003 (Harmony Central, 2003-07-24:
#         https://web.archive.org/web/20241113144010/https://www.harmonycentral.com/news/keyboards-and-pianos/technics-launches-sx-kn2400-and-sx-kn2600-digital-keyboards-r3962/)
#   2002  KN7000            demodb.org/en/technics; kn7000.md
#   1999  KN6000 (KN6500 2001)  service manual EMID9908016C0 (the number encodes 1999-08);
#         demodb.org/en/technics and Synth Site (sonicstate.com) also give 1999
#   1997  KN5000            demodb.org/en/technics; Sound On Sound review, April 1998
#   1996  KN1500            demodb.org/en/technics; kn1500.md
#   1995  SX-WSA1 / WSA1R   demodb.org/en/technics; wsa1.md
#
# Pages about the whole project, or about several models at once, go under
# Introduction, not under one model.

